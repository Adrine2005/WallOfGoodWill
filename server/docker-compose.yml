version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - DATABASE_URL=postgres://goodwill:goodwill123@postgres:5432/goodwill?sslmode=disable
      # Optional Supabase credentials:
      # - SUPABASE_URL=https://<project-ref>.supabase.co
      # - SUPABASE_SERVICE_ROLE_KEY=your_key_here
      # - SUPABASE_STORAGE_BUCKET=goodwill-images
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: goodwill
      POSTGRES_PASSWORD: goodwill123
      POSTGRES_DB: goodwill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodwill -d goodwill"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

